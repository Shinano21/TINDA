{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> {% if page_title %}
    <title>{{ page_title }} | Grocery Point Of Sale System</title>
    {% else %}
    <title>Grocery Point Of Sale System</title>
    {% endif %}
    <link rel="stylesheet" href="{% static 'posApp/assets/default/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/bootstrap/css/bootstrap.min.css' %}">

    <!-- plugins:css -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/mdi/css/materialdesignicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/css/vendor.bundle.base.css' %}">
    <!-- endinject -->
    <!-- Plugin css for this page -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/flag-icon-css/css/flag-icon.min.css' %}">
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/vendors/jvectormap/jquery-jvectormap.css' %}">
    <!-- End plugin css for this page -->
    <!-- Layout styles -->
    <link rel="stylesheet" href="{% static 'posApp/assets/material-admin/css/demo/style.css' %}">
    <!-- End layout styles -->
    <link rel="shortcut icon" href="{% static 'posApp/assets/material-admin/images/favicon.png' %}" />
    <style>
        body.login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            background-color: rgba(255,255,255,0.96);
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2) !important;
        }
        .card-login .card-body {
            padding: 2.5rem;
        }
        .card-title {
            font-weight: 600;
            color: #667eea;
            font-size: 1.75rem;
            letter-spacing: 0.5px;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
        }
        .form-control {
            border: 1px solid #e9ecef;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            background-color: #fff;
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #667eea;
            border: none;
            background: none;
            padding: 0.25rem 0.5rem;
            font-size: 1.2rem;
            z-index: 10;
            transition: all 0.2s ease;
        }
        .password-toggle:hover {
            color: #764ba2;
            transform: translateY(-50%) scale(1.1);
        }
        .password-field-wrapper {
            position: relative;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-outline-secondary {
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .btn-outline-secondary:hover {
            background-color: #f8f9fa;
            border-color: #667eea;
            color: #667eea;
        }
        .btn-link {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .login-footer {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }
        .login-footer a {
            flex: 1;
            text-align: center;
        }
        .alert {
            border-radius: 0.5rem;
            border: none;
            margin-bottom: 1.5rem;
        }
    </style>
    <script src="{% static 'posApp/assets/default/js/jquery-3.6.0.min.js' %}">
    </script>
    <script src="{% static 'posApp/assets/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'posApp/assets/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'posApp/assets/bootstrap/js/popper.min.js' %}"></script>
</head>

<body class="login-bg">
    <!-- preloader script kept for compatibility -->
    <script src="{% static 'posApp/assets/material-admin/js/preloader.js' %}"></script>

    <div class="container d-flex vh-100 align-items-center justify-content-center">
        <div class="card card-login shadow-sm w-100" style="max-width:420px">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Grocery POS System</h3>
                <form id="login-user" action="" method="post" novalidate>
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="mdi mdi-account"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
                    </div>
                    <div class="input-group mb-3 password-field-wrapper">
                        <span class="input-group-text"><i class="mdi mdi-lock"></i></span>
                        <input type="password" id="password-field" name="password" class="form-control" placeholder="Password" required>
                        <button type="button" id="password-toggle" class="password-toggle">
                            <i class="mdi mdi-eye"></i>
                        </button>
                    </div>
                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" type="submit">Sign In</button>
                    </div>
                    <div class="login-footer">
                        <a href="{% url 'register_user' %}" class="btn btn-outline-secondary btn-sm">Create Account</a>
                        <a href="{% url 'password_reset' %}" class="btn btn-link btn-sm">Forgot Password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        window.start_loader = function() {
            $('body').removeClass('loaded')
        }
        window.end_loader = function() {
            $('body').addClass('loaded')
        }
        window.uni_modal = function($title = '', $url = '', $size = "") {
            start_loader()
            $.ajax({
                url: $url,
                error: err => {
                    console.log()
                    alert("An error occured")
                },
                success: function(resp) {
                    if (resp) {
                        $('#uni_modal .modal-title').html($title)
                        $('#uni_modal .modal-body').html(resp)
                        if ($size != '') {
                            $('#uni_modal .modal-dialog').addClass($size + '  modal-dialog-centered')
                        } else {
                            $('#uni_modal .modal-dialog').removeAttr("class").addClass("modal-dialog modal-md modal-dialog-centered")
                        }
                        $('#uni_modal').modal({
                            backdrop: 'static',
                            keyboard: false,
                            focus: true
                        })
                        $('#uni_modal').modal('show')
                        end_loader()
                    }
                }
            })
        }
        window._conf = function($msg = '', $func = '', $params = []) {
            $('#confirm_modal #confirm').attr('onclick', $func + "(" + $params.join(',') + ")")
            $('#confirm_modal .modal-body').html($msg)
            $('#confirm_modal').modal('show')
        }
        $(function() {

        })
    </script>

    <script src="{% static 'posApp/assets/material-admin/vendors/js/vendor.bundle.base.js' %}"></script>
    <script src="{% static 'posApp/assets/material-admin/js/material.js' %}"></script>
    <script src="{% static 'posApp/assets/material-admin/js/misc.js' %}"></script>
    <script src="{% static 'posApp/assets/material-admin/js/dashboard.js' %}"></script>
    <script>
        // Password visibility toggle
        $(document).ready(function() {
            const passwordField = $('#password-field');
            const passwordToggle = $('#password-toggle');
            
            passwordToggle.on('click', function(e) {
                e.preventDefault();
                const type = passwordField.attr('type');
                const icon = passwordToggle.find('i');
                
                if (type === 'password') {
                    passwordField.attr('type', 'text');
                    icon.removeClass('mdi-eye').addClass('mdi-eye-off');
                } else {
                    passwordField.attr('type', 'password');
                    icon.removeClass('mdi-eye-off').addClass('mdi-eye');
                }
            });
        });
    </script>
    <script>
        $(function() {
            $('#login-user').submit(function(e) {
                e.preventDefault();
                var _this = $(this)
                $('.err-msg').remove();
                var el = $('<div>')
                el.addClass("alert alert-danger err-msg")
                el.hide()
                if (_this[0].checkValidity() == false) {
                    _this[0].reportValidity();
                    return false;
                }
                start_loader();
                $.ajax({
                    headers: {
                        "X-CSRFToken": '{{csrf_token}}'
                    },
                    url: "{% url 'login-user' %}",
                    data: new FormData($(this)[0]),
                    cache: false,
                    contentType: false,
                    processData: false,
                    method: 'POST',
                    type: 'POST',
                    dataType: 'json',
                    error: err => {
                        console.log(err)
                        alert_toast("An error occured", 'error');
                        end_loader();
                    },
                    success: function(resp) {
                        if (typeof resp == 'object' && resp.status == 'success') {
                            el.removeClass("alert alert-danger err-msg")
                            location.href = "{% url 'home-page' %}"
                        } else if (resp.status == 'failed' && !!resp.msg) {
                            el.text(resp.msg)
                        } else {
                            el.text("An error occured", 'error');
                            end_loader();
                            console.err(resp)
                        }
                        _this.prepend(el)
                        el.show('slow')
                        $("html, body, .modal").scrollTop(0);
                        end_loader()
                    }
                })
            })
        })
    </script>
</body>

</html>
